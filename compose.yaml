services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartbudget
      POSTGRES_USER: smartbudget
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?configure DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbudget"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,openai
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/smartbudget
      DATABASE_USERNAME: smartbudget
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?configure DATABASE_PASSWORD}
      APP_BOOTSTRAP_ADMIN_TOKEN: ${APP_BOOTSTRAP_ADMIN_TOKEN:-}
      APP_BOOTSTRAP_ADMIN_USERNAME: ${APP_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?configure OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
