spring.application.name=smart-budget-ai-api

spring.datasource.url=jdbc:h2:file:./data/smartbudget;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=Smart Budget AI API
info.app.description=Assistente financeiro com confirmação explícita para mutações

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.pattern.level=%5p [requestId:%X{requestId:-none}]

app.security.enabled=false
app.security.api-key=

spring.ai.model.chat=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false

app.ai.mode=demo
