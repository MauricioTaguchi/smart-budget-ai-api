spring.ai.model.chat=openai
spring.ai.model.audio.transcription=openai
spring.ai.model.audio.speech=openai

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.chat.temperature=0.2

spring.ai.openai.audio.transcription.model=gpt-4o-mini-transcribe
spring.ai.openai.audio.transcription.language=pt

spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=alloy
spring.ai.openai.audio.speech.response-format=mp3
spring.ai.openai.audio.speech.speed=1.0

app.ai.mode=openai

spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=true