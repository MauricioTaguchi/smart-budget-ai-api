name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartbudget_ci
          POSTGRES_USER: smartbudget_ci
          POSTGRES_PASSWORD: ci-only-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartbudget_ci -d smartbudget_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/smartbudget_ci
      TEST_POSTGRES_USERNAME: smartbudget_ci
      TEST_POSTGRES_PASSWORD: ci-only-not-for-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -Dtest=PostgresMigrationTest test
